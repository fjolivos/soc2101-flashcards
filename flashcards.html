<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8372d">
<title>SOC2101 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#c8372d,#3d1210);--bg2:light-dark(#a92b22,#2a0c0a);
--card:light-dark(#ffffff,#1d1b1a);--ink:light-dark(#191716,#f3efe9);--soft:light-dark(#5e5853,#b5ada5);
--rule:light-dark(#d8e4f2,#2c3440);--margin:light-dark(#f1a7a1,#6b2b27);
--hi:#ffe14d;--hiInk:#191716;--bad:light-dark(#fde2df,#4a1a17);--badInk:light-dark(#a2241b,#ff9d94);
--onbg:#fff;--chip:rgba(255,255,255,.16)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px 18px;gap:12px}
header{color:var(--onbg)}
h1{font:800 22px/1.05 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
h1 small{display:block;font:500 13px/1.3 Inter,sans-serif;opacity:.85;margin-top:3px}
.seg{display:flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--onbg);font:600 14px Inter,sans-serif;padding:10px 14px;border-radius:999px;min-height:40px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:#a92b22}
.row{display:flex;gap:8px;align-items:center}
.pick{flex:1;position:relative}
.pick select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:var(--chip);color:var(--onbg);font:600 14px Inter,sans-serif;padding:10px 38px 10px 14px;border-radius:999px;min-height:42px;cursor:pointer}
.pick select option{color:#191716;background:#fff}
.pick::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.chip{border:0;background:var(--chip);color:var(--onbg);font:600 14px Inter,sans-serif;padding:9px 14px;border-radius:999px;min-height:42px;cursor:pointer;flex:none}
.prog{color:var(--onbg);font:600 13px Inter,sans-serif;display:flex;gap:10px;align-items:center}
.bar{flex:1;height:8px;background:var(--bg2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi);width:0;transition:width .3s}
.stage{position:relative;flex:1;min-height:560px;perspective:1400px}
.stage::before,.stage::after{content:"";position:absolute;inset:10px 10px -6px;background:var(--card);opacity:.55;border-radius:18px;transform:rotate(-1.6deg)}
.stage::after{inset:6px 4px -3px;opacity:.75;transform:rotate(1.2deg)}
.card{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:18px;
 box-shadow:0 14px 30px rgba(60,10,6,.35);padding:20px 18px 18px 34px;display:flex;flex-direction:column;overflow:auto;
 background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 24px,transparent 24px),
 repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 58px}
.back{transform:rotateY(180deg)}
.tag{font:600 12px Inter,sans-serif;color:var(--soft);display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.q{font:700 clamp(18px,4.8vw,21px)/1.3 Archivo,sans-serif;margin:0 0 12px;text-wrap:pretty}
.st{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.st li{display:flex;gap:8px;font:500 15px/1.4 Inter,sans-serif;padding:3px 6px;border-radius:6px}
.st li em{flex:none;font:700 14px Archivo,sans-serif;font-style:normal;width:26px;color:var(--soft)}
.st li.t{background:var(--hi);color:var(--hiInk)}.st li.t em{color:var(--hiInk)}
.st li.f{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opts li,.opts button{display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%;font:500 15px/1.4 Inter,sans-serif;color:var(--ink);
 background:color-mix(in srgb,var(--card) 88%,var(--ink));border:2px solid transparent;border-radius:12px;padding:10px 12px;min-height:46px}
.opts button{cursor:pointer}
.opts button:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.opts b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px Archivo,sans-serif;background:var(--card);border:1.5px solid var(--soft)}
.opts .ok{background:var(--hi);color:var(--hiInk);border-color:#e0bf1c}.opts .ok b{background:#fff;border-color:var(--hiInk);color:var(--hiInk)}
.opts .no{background:var(--bad);color:var(--badInk);border-color:currentColor}
.opts .dim{opacity:.5}
.hint{margin-top:auto;padding-top:14px;font:500 13px Inter,sans-serif;color:var(--soft);text-align:center}
.ans{font:500 13px Inter,sans-serif;color:var(--soft);margin:0 0 6px}
.big{font:800 clamp(19px,5vw,24px)/1.25 Archivo,sans-serif;background:linear-gradient(transparent 55%,var(--hi) 55% 92%,transparent 92%);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:var(--ink)}
.exp{margin:14px 0 0;font-size:15px;line-height:1.55}
.exp strong{font-family:Archivo,sans-serif}
.study{margin-top:12px;padding:10px 12px;border-radius:12px;border:2px dashed var(--margin);font-size:14px;line-height:1.45}
.study strong{display:block;font:800 13px Archivo,sans-serif;letter-spacing:.02em;text-transform:uppercase;color:#c8372d;margin-bottom:2px}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;background:color-mix(in srgb,var(--card) 88%,var(--ink))}
.fb strong{display:block;font:800 16px Archivo,sans-serif;margin-bottom:2px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btn{border:0;border-radius:14px;min-height:54px;font:700 16px Archivo,sans-serif;cursor:pointer;padding:0 14px}
.btn.ghost{background:var(--bg2);color:#fff}
.btn.white{background:#fff;color:#a92b22}
.btn.yellow{background:var(--hi);color:var(--hiInk)}
.btn:disabled{opacity:.4;cursor:default}
.full{grid-column:1/-1}
.done{position:absolute;inset:0;z-index:2;background:var(--card);border-radius:18px;box-shadow:0 14px 30px rgba(60,10,6,.35);padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:auto}
.score{font:800 clamp(56px,20vw,90px)/1 Archivo,sans-serif;color:#c8372d}
@media(prefers-color-scheme:dark){.score,.study strong{color:var(--hi)}}
.done h2{font:800 26px/1.1 Archivo,sans-serif;margin:4px 0}
.done p{margin:0 0 10px;color:var(--soft);max-width:36ch}
.done .controls{width:100%;max-width:360px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
 <header>
  <h1>SOC2101 Flashcards<small>Introduction to Sociology · Macionis · 120 practice questions</small></h1>
 </header>
 <div class="seg" role="group" aria-label="Mode">
  <button id="mFlash" aria-pressed="true">Flashcards</button>
  <button id="mQuiz" aria-pressed="false">Quiz</button>
 </div>
 <div class="row">
  <label class="pick"><span hidden>Choose a deck</span>
   <select id="deck" aria-label="Choose a deck"></select>
  </label>
  <button class="chip" id="shuf" aria-label="Shuffle the cards">Shuffle</button>
 </div>
 <div class="prog"><span id="count">1 / 120</span><div class="bar"><i id="fill"></i></div><span id="tally"></span></div>
 <div class="stage" id="stage">
  <div class="card" id="card" tabindex="0" aria-live="polite">
   <div class="face front" id="front"></div>
   <div class="face back" id="back"></div>
  </div>
  <div class="done" id="done" hidden></div>
 </div>
 <div class="controls" id="controls"></div>
</div>
<script>
{
const Q=[{"c":1,"p":"A","q":"Asked why they chose their university, most students give personal reasons. A sociologist points out that family income and parents’ schooling shape such choices for whole categories of students. The sociologist is ___","o":["relying on common sense.","judging the students ethnocentrically.","seeing the general in the particular.","using a biological explanation."],"a":2,"e":"The sociological perspective looks for general patterns of society in the lives of particular people.","r":"Ch. 1 The Sociological Perspective, “Seeing the General in the Particular; Seeing the Strange in the Familiar”, pp. 3–4"},{"c":1,"p":"A","q":"A classic study of suicide in France found higher suicide rates among men, Protestants, the wealthy, and the unmarried. Which of the following help(s) explain this pattern?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"Suicide rates reflect social integration: individualistic categories with weak social ties had higher rates.","r":"Ch. 1 The Sociological Perspective, “Seeing Society in Our Everyday Lives (Durkheim on suicide)”, p. 6","st":[["Categories of people with strong social ties had lower suicide rates.",1],["Greater freedom and individualism weaken social ties and raise the risk of suicide.",1],["Even a very personal choice can show general patterns shaped by society.",1],["Suicide rates are explained mainly by individual personality differences.",0]]},{"c":1,"p":"A","q":"When millions of people lose their jobs in an economic recession, a sociologist argues that unemployment should be seen as a public issue rather than only a personal trouble. This way of thinking is called ___","o":["positivism.","ethnocentrism.","a latent function.","the sociological imagination."],"a":3,"e":"The sociological imagination links personal troubles to public issues and to broader social change.","r":"Ch. 1 The Sociological Perspective, “The Sociological Imagination”, p. 7"},{"c":1,"p":"A","q":"Which of the following statements about the scientific study of society is/are correct?","o":["Only i and ii","Only ii and iii","Only i, ii, and iii","All of them"],"a":0,"e":"A theory is a statement of how and why specific facts are related; positivism applies the scientific approach to society.","r":"Ch. 1 The Sociological Perspective, “Science and Sociology: Comte’s Three Stages of Society”, p. 13","st":[["Positivism is a scientific approach to knowledge based on “positive” facts as opposed to mere speculation.",1],["Sociologists test their theories by gathering evidence using research methods.",1],["Positivism holds that society cannot be studied with the methods used to study the physical world.",0],["A theory is a list of facts that does not try to explain how or why they are related.",0]]},{"c":1,"p":"A","q":"Colleges bring together young people of similar social backgrounds who may later marry. From a structural-functional perspective, this is a ___ of higher education.","o":["manifest function","latent function","social dysfunction","social structure"],"a":1,"e":"Latent functions are unrecognized and unintended consequences. Manifest functions are recognized and intended.","r":"Ch. 1 The Sociological Perspective, “The Structural-Functional Approach”, p. 15"},{"c":1,"p":"A","q":"Which of the following statements about sociology’s theoretical approaches is/are correct?","o":["Only i and ii","Only i, ii, and iv","Only ii, iii, and iv","All of them"],"a":1,"e":"The social-conflict approach sees society as an arena of inequality, not a system of cooperating parts.","r":"Ch. 1 The Sociological Perspective, “Theoretical Approaches (Structural-Functional, Social-Conflict, Symbolic-Interaction)”, pp. 15–18","st":[["The structural-functional and social-conflict approaches share a macro-level orientation.",1],["The symbolic-interaction approach has a micro-level orientation.",1],["The social-conflict approach sees society as a system whose parts work together to promote solidarity and stability.",0],["Gender-conflict and race-conflict theories are types of social-conflict theory.",1]]},{"c":3,"p":"A","q":"According to the textbook, culture includes which of the following?","o":["Only i","Only i and ii","Only ii and iii","Only i, ii, and iii"],"a":3,"e":"Culture is the ways of thinking, the ways of acting, and the material objects that form a way of life.","r":"Ch. 3 Culture, “What Is Culture?”, p. 60","st":[["The ways of thinking",1],["The ways of acting",1],["The material objects that together form a people’s way of life",1],["The genetic traits shared by members of a society",0]]},{"c":3,"p":"A","q":"A student arriving in a foreign country feels confused and disoriented by an unfamiliar way of life. Sociologists call this ___","o":["culture shock.","cultural lag.","cultural relativism.","ethnocentrism."],"a":0,"e":"Culture shock is personal disorientation when experiencing an unfamiliar way of life.","r":"Ch. 3 Culture, “What Is Culture?”, p. 62"},{"c":3,"p":"A","q":"Because people in a society place great importance on achievement, many of them hold the specific idea that “anyone who works hard can get ahead.” In this example, the idea that hard work leads to success is a ___","o":["value.","belief.","norm.","folkway."],"a":1,"e":"Values are broad principles (achievement) that support beliefs, the specific ideas people hold to be true.","r":"Ch. 3 Culture, “Values and Beliefs”, p. 67"},{"c":3,"p":"A","q":"Which of the following statements about norms is/are correct?","o":["Only i, ii, and iv","Only i and iii","Only ii and iii","All of them"],"a":0,"e":"Mores separate right from wrong. Folkways separate right from rude, and breaking them brings only mild reactions.","r":"Ch. 3 Culture, “Norms”, p. 69","st":[["Mores are norms that are widely observed and have great moral significance.",1],["Folkways are norms for routine or casual interaction.",1],["Violating a folkway usually brings a severe punishment.",0],["Wearing jeans to a formal dinner party is an example of violating a folkway.",1]]},{"c":3,"p":"A","q":"Which of the following statements about high culture and popular culture is/are correct?","o":["Only i and ii","Only ii and iv","Only i, ii, and iii","All of them"],"a":2,"e":"Sociologists ask whether high culture is praised for being better or simply because its supporters are powerful.","r":"Ch. 3 Culture, “High Culture and Popular Culture”, p. 72","st":[["High culture refers to cultural patterns that distinguish a society’s elite.",1],["Popular culture refers to cultural patterns that are widespread among a society’s population.",1],["Sociologists are uneasy with judging high culture as superior, partly because its supporters have more money, power, and prestige.",1],["High culture is inherently better than popular culture.",0]]},{"c":3,"p":"A","q":"From the social-conflict perspective, a society’s culture is shaped mainly by ___","o":["culture helps society meet human needs.","culture is shaped by a society’s system of economic production.","culture is learned through face-to-face interaction.","cultural values are rooted in human biology."],"a":1,"e":"Social-conflict theory links culture to inequality: the economic system shapes ideas and values that support the powerful.","r":"Ch. 3 Culture, “Social-Conflict Theory”, p. 81"},{"c":5,"p":"A","q":"In the nineteenth century, many people claimed that members of less technologically developed societies were biologically less evolved. In the twentieth century, social scientists rejected this view mainly because ___","o":["behavior is learned, and people everywhere are equally human, differing only in their cultural patterns.","biological instincts were shown to explain all human behavior.","Darwin’s theory proved that some societies are more advanced than others.","personality was shown to be fixed at birth."],"a":0,"e":"Social scientists rooted behavior in nurture, not instinct. Nature matters, but nurture matters more.","r":"Ch. 5 Socialization, “The Biological Sciences: The Role of Nature; The Social Sciences: The Role of Nurture”, p. 114"},{"c":5,"p":"A","q":"Which of the following statements about the peer group as an agent of socialization is/are correct?","o":["Only i and ii","Only ii and iv","Only i, ii, and iii","All of them"],"a":2,"e":"In a rapidly changing society, peer groups have great influence, and young and old may differ because of a “generation gap.”","r":"Ch. 5 Socialization, “The Peer Group”, p. 122","st":[["Its members usually have interests, social position, and age in common.",1],["It lets children escape the direct supervision of adults.",1],["Its importance typically peaks during adolescence.",1],["In a rapidly changing society, peer groups have little influence.",0]]},{"c":5,"p":"A","q":"Research shows that lower-class parents are more likely than upper-class parents to stress obedience in their children. The textbook explains this by pointing out that lower-class parents ___","o":["they care less about their children’s success.","they usually perform routine jobs under close supervision and expect their children to hold similar positions.","schools in poor communities require obedience.","the mass media teach obedience to lower-class families."],"a":1,"e":"Parents tend to prepare children for jobs like their own.","r":"Ch. 5 Socialization, “The Family: Race and Class”, p. 121"},{"c":5,"p":"A","q":"Which of the following statements about the school as an agent of socialization is/are correct?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":3,"e":"Schools teach far more than the formal lessons.","r":"Ch. 5 Socialization, “The School”, p. 122","st":[["Schools informally teach many things that together might be called the hidden curriculum.",1],["For most children, school is the first experience with bureaucracy.",1],["Schooling enlarges children’s social world to include people with backgrounds different from their own.",1],["Activities such as spelling bees can teach children how society divides the population into “winners” and “losers.”",1]]},{"c":5,"p":"A","q":"A secondary school student starts dressing and speaking like university students because she hopes to join them soon. This is an example of ___","o":["anticipatory socialization.","resocialization.","the hidden curriculum.","role exit."],"a":0,"e":"Anticipatory socialization is learning that helps a person achieve a desired position.","r":"Ch. 5 Socialization, “The Peer Group”, p. 122"},{"c":5,"p":"A","q":"Total institutions, such as prisons and mental hospitals, share three characteristics. Which of the following is NOT one of them?","o":["Staff members supervise all aspects of daily life.","Life is controlled and standardized.","Formal rules dictate when, where, and how inmates perform their daily routines.","Residents freely choose their own daily activities."],"a":3,"e":"Total institutions control inmates’ lives completely, including prisons and mental hospitals.","r":"Ch. 5 Socialization, “Resocialization: Total Institutions”, p. 129"},{"c":6,"p":"A","q":"Mei is a daughter, a university student, a part-time cashier, and a church member. Together, these positions make up her ___","o":["role set.","master status.","status set.","achieved status."],"a":2,"e":"A role set is the roles linked to one status. A status set is all the statuses a person holds.","r":"Ch. 6 Social Interaction in Everyday Life, “Status Set”, p. 138"},{"c":6,"p":"A","q":"Which of the following statements about ascribed and achieved statuses is/are correct?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"Widower is ascribed, because it is taken on involuntarily.","r":"Ch. 6 Social Interaction in Everyday Life, “Ascribed and Achieved Status”, p. 138","st":[["An ascribed status is received at birth or taken on involuntarily later in life.",1],["An achieved status is taken on voluntarily and reflects personal ability and effort.",1],["In the real world, most statuses involve a combination of ascription and achievement.",1],["Being a widower is an example of an achieved status.",0]]},{"c":6,"p":"A","q":"Some longtime friends begin to avoid a man after he is diagnosed with a serious illness, seeing him only in terms of his illness. In this case, the illness has become a ___","o":["master status.","role set.","role strain.","status set."],"a":0,"e":"A master status can be negative as well as positive.","r":"Ch. 6 Social Interaction in Everyday Life, “Master Status”, pp. 138–139"},{"c":6,"p":"A","q":"A professor enjoys being friendly with her students but must also keep the distance needed to evaluate them fairly. Both expectations are attached to the same status. This is an example of ___","o":["role conflict.","role set.","role exit.","role strain."],"a":3,"e":"Role strain is tension among roles connected to a single status. Role conflict involves two or more statuses.","r":"Ch. 6 Social Interaction in Everyday Life, “Role Conflict and Role Strain”, p. 140"},{"c":6,"p":"A","q":"Which of the following best illustrates the Thomas theorem?","o":["A student memorizes the rules of grammar before writing an essay.","A teacher believes a certain student is intellectually gifted and encourages the student, who then performs exceptionally.","Two students hold the same status but perform different roles.","A worker leaves a job and becomes an “ex-employee.”"],"a":1,"e":"Situations defined as real are real in their consequences.","r":"Ch. 6 Social Interaction in Everyday Life, “The Thomas Theorem”, p. 142"},{"c":6,"p":"A","q":"Which of the following statements about Goffman’s dramaturgical analysis is/are correct?","o":["Only i, ii, and iii","Only ii and iv","Only i and iv","All of them"],"a":0,"e":"The waiting room is the front region. The examination room and private office are the back region.","r":"Ch. 6 Social Interaction in Everyday Life, “Dramaturgical Analysis: The “Presentation of Self””, p. 144","st":[["A status is like a part in a play, and a role serves as a script.",1],["The presentation of self is a person’s efforts to create specific impressions in the minds of others.",1],["A performance includes how we dress (costume), the objects we carry (props), and our tone of voice and gestures (demeanor).",1],["In a doctor’s office, the examination room and the doctor’s private office form the “front region.”",0]]},{"c":7,"p":"A","q":"Which of the following statements about secondary groups is/are correct?","o":["Only i","Only ii and iii","Only i and ii","All of them"],"a":2,"e":"Primary groups are personal and define members by who they are. Secondary groups are impersonal and goal-oriented.","r":"Ch. 7 Groups and Organizations, “Primary and Secondary Groups”, pp. 161–162","st":[["They are large and impersonal.",1],["Their members pursue a specific goal or activity.",1],["Their members usually think of themselves as “we.”",0],["Their members define each other according to who they are rather than what they are.",0]]},{"c":7,"p":"A","q":"A government committee quickly agrees on a risky plan. Members who have doubts stay silent because no one wants to disagree, and the group ignores warning signs. Sociologists call this ___","o":["a reference group.","groupthink.","bureaucratic ritualism.","role strain."],"a":1,"e":"Group conformity can narrow a group’s view of an issue and lead to poor decisions.","r":"Ch. 7 Groups and Organizations, “Group Conformity: Groupthink”, p. 163"},{"c":7,"p":"A","q":"A classic study of soldiers found that those in army units with low promotion rates were more positive about their chances of promotion than those in units with high promotion rates. This finding is best explained by ___","o":["reference groups.","in-groups and out-groups.","groupthink.","bureaucratic inertia."],"a":0,"e":"People judge their situation by comparing themselves with a reference group, not by absolute standards.","r":"Ch. 7 Groups and Organizations, “Reference Groups”, p. 164"},{"c":7,"p":"A","q":"Which of the following correctly describe(s) types of formal organizations?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"A volunteer charity is a normative organization.","r":"Ch. 7 Groups and Organizations, “Types of Formal Organizations”, p. 168","st":[["Utilitarian organizations pay people for their efforts.",1],["People join normative organizations to pursue goals they consider morally worthwhile.",1],["Coercive organizations have involuntary members, as in prisons.",1],["A volunteer charity group is an example of a coercive organization.",0]]},{"c":7,"p":"A","q":"The ideal bureaucracy has six key elements. Which of the following is NOT one of them?","o":["Specialization","Hierarchy of offices","Hiring based on personal loyalty","Formal, written communications"],"a":2,"e":"Bureaucracy hires and promotes people on technical competence, not personal ties.","r":"Ch. 7 Groups and Organizations, “Characteristics of Bureaucracy”, pp. 169–170"},{"c":7,"p":"A","q":"Which of the following problems of bureaucracy is/are correctly described?","o":["Only i and ii","Only ii and iii","Only i, iii, and iv","All of them"],"a":3,"e":"All four are problems of bureaucracy described in the chapter.","r":"Ch. 7 Groups and Organizations, “Problems of Bureaucracy”, p. 171","st":[["Bureaucratic alienation: treating people as “cases” can dehumanize the people bureaucracy is supposed to serve.",1],["Bureaucratic ritualism: strict attention to rules to the point of interfering with the organization’s goals.",1],["Bureaucratic inertia: the tendency of bureaucratic organizations to perpetuate themselves.",1],["Oligarchy: the rule of the many by the few.",1]]},{"c":9,"p":"A","q":"Which of the following is NOT one of the three social foundations of deviance identified in the textbook?","o":["Deviance varies according to cultural norms.","People become deviant as others define them that way.","How societies set norms and define rule breaking both involve social power.","Deviance is mainly caused by inherited personality traits."],"a":3,"e":"The three foundations: deviance varies with norms, people become deviant as others define them, and power shapes norms.","r":"Ch. 9 Deviance, “The Social Foundations of Deviance”, p. 214"},{"c":9,"p":"A","q":"Which of the following statements is/are consistent with Emile Durkheim’s view of deviance?","o":["Only i, ii, and iv","Only ii and iii","Only i and iv","All of them"],"a":0,"e":"Durkheim said deviance is a necessary part of social organization. Even a “society of saints” would create deviance.","r":"Ch. 9 Deviance, “Durkheim’s Basic Insight”, p. 215","st":[["There is nothing abnormal about deviance.",1],["Today’s deviance can become tomorrow’s morality.",1],["A “society of saints” would have no deviance at all.",0],["Deviance is needed to define and support morality.",1]]},{"c":9,"p":"A","q":"Which of the following correctly describe(s) Merton’s responses to strain?","o":["Only i and ii","Only ii and iii","Only i, ii, and iii","All of them"],"a":2,"e":"Conformity means pursuing approved goals through approved means, not unconventional goals.","r":"Ch. 9 Deviance, “Merton’s Strain Theory”, pp. 216–217","st":[["Ritualism: not caring much about becoming rich but rigidly sticking to the rules to feel “respectable.”",1],["Retreatism: rejecting both cultural goals and conventional means, so that a person “drops out.”",1],["Rebellion: rejecting both goals and means, and forming a counterculture that supports alternatives.",1],["Conformity: pursuing unconventional goals through approved means.",0]]},{"c":9,"p":"A","q":"A young man is described as an “alcohol abuser” and excluded from his friendship network. He becomes bitter, drinks even more, and seeks the company of others who approve of his drinking. According to labeling theory, this marks the beginning of ___","o":["projective labeling.","primary deviance.","secondary deviance.","retrospective labeling."],"a":2,"e":"Primary deviance is a passing episode. Secondary deviance is the deeper deviant identity that follows others’ reactions.","r":"Ch. 9 Deviance, “Primary and Secondary Deviance”, p. 218"},{"c":9,"p":"A","q":"Whether we define deviance as a moral issue or a medical issue makes a difference. According to the textbook, the choice of label affects ___","o":["Only i and ii","Only ii and iii","Only i, ii, and iii","All of them"],"a":2,"e":"Once labeled “sick,” people are seen as less able to control their own actions.","r":"Ch. 9 Deviance, “The Difference Labels Make”, pp. 219–220","st":[["who responds to deviance (e.g., police versus clinical specialists).",1],["how people respond to deviance (e.g., punishment versus treatment).",1],["how we view the personal competence of the deviant person.",1],["whether the deviant person is seen as more responsible for his or her own actions once labeled “sick.”",0]]},{"c":9,"p":"A","q":"Social-conflict theory explains why less powerful people are more likely to be labeled deviant. Which of the following statements reflect(s) this explanation?","o":["Only i, ii, and iii","Only ii and iv","Only i and iv","All of them"],"a":0,"e":"Deviants are typically not as bad or harmful as they are powerless.","r":"Ch. 9 Deviance, “Deviance and Power”, p. 221","st":[["All norms, especially laws, generally reflect the interests of the rich and powerful.",1],["Even if their behavior is called into question, the powerful have the resources to resist deviant labels.",1],["The belief that norms and laws are natural and good masks their political character.",1],["Laws are applied equally to everyone regardless of class position.",0]]},{"c":10,"p":"B","q":"Paying a high price for a luxury handbag mainly because of the “statement” it makes about one’s social position is called ___","o":["status consistency.","conspicuous consumption.","meritocracy.","social mobility."],"a":1,"e":"Symbolic interaction shows how everyday products signal social position.","r":"Ch. 10 Social Stratification, “Symbolic-Interaction Theory: Stratification in Everyday Life”, p. 257"},{"c":10,"p":"B","q":"Which of the following is/are among the four basic principles of social stratification?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":3,"e":"All four statements are principles of social stratification.","r":"Ch. 10 Social Stratification, “What Is Social Stratification?”, pp. 243–244","st":[["Social stratification is a trait of society, not simply a reflection of individual differences.",1],["Social stratification carries over from generation to generation.",1],["Social stratification is universal but variable.",1],["Social stratification involves not just inequality but beliefs as well.",1]]},{"c":10,"p":"B","q":"First-class passengers on the Titanic survived at much higher rates than third-class passengers, not because they were better swimmers. This illustrates that ___","o":["social stratification is a trait of society, not simply a reflection of individual differences.","social stratification involves beliefs as well as inequality.","social stratification is universal but variable.","meritocracy rewards ability and effort."],"a":0,"e":"Survival depended on class position, not on individual ability.","r":"Ch. 10 Social Stratification, “What Is Social Stratification?”, p. 243"},{"c":10,"p":"B","q":"Compared with caste systems, class systems tend to have ___","o":["less social mobility and higher status consistency.","more social mobility and lower status consistency.","more social mobility and higher status consistency.","less social mobility and lower status consistency."],"a":1,"e":"Caste systems have little mobility and high status consistency. Class systems are the opposite.","r":"Ch. 10 Social Stratification, “Status Consistency”, p. 247"},{"c":10,"p":"B","q":"Which of the following statements about meritocracy is/are correct?","o":["Only i and ii","Only ii and iv","Only i, ii, and iii","All of them"],"a":2,"e":"Industrial societies mix meritocracy with caste elements such as family.","r":"Ch. 10 Social Stratification, “The Class System”, pp. 245–247","st":[["Meritocracy is social stratification based on personal merit.",1],["A pure meritocracy has never existed.",1],["Class systems in industrial societies develop some meritocracy but keep caste elements, such as family.",1],["Caste systems reward individual talent and effort more than class systems do.",0]]},{"c":10,"p":"B","q":"Many people believe that the rich deserve their wealth because they worked harder and were more talented than others. Because this belief helps a society’s inequality persist with little challenge, sociologists treat it as ___","o":["a cultural universal.","a folkway.","ideology.","status consistency."],"a":2,"e":"Ideology is cultural beliefs that justify social arrangements, including patterns of inequality.","r":"Ch. 10 Social Stratification, “Ideology: Supporting Stratification”, p. 251"},{"c":10,"p":"B","q":"Which of the following statements about the Davis-Moore thesis and its critique is/are correct?","o":["Only i, ii, and iv","Only i and iii","Only ii and iii","All of them"],"a":0,"e":"The thesis does not say exactly what reward each job should get.","r":"Ch. 10 Social Stratification, “The Davis-Moore Thesis”, pp. 253–254","st":[["Social stratification has beneficial consequences for the operation of society.",1],["The greater the functional importance of a position, the more rewards a society attaches to it.",1],["The thesis states exactly how much reward each occupation should receive.",0],["Critics ask how we can assess the functional importance of a particular occupation.",1]]},{"c":10,"p":"B","q":"A factory worker owns no productive property and must sell her labor to a company owner for a wage. In Karl Marx’s terms, she is ___","o":["a capitalist.","an aristocrat.","a member of the first estate.","a proletarian."],"a":3,"e":"Capitalists own the means of production. Proletarians sell their labor for wages.","r":"Ch. 10 Social Stratification, “Karl Marx: Class Conflict”, p. 254"},{"c":10,"p":"B","q":"Max Weber argued that social stratification involves three distinct dimensions of inequality. They are ___","o":["income, wealth, and occupation.","caste, class, and meritocracy.","class position, status (social prestige), and power.","ideology, culture, and power."],"a":2,"e":"Weber’s multidimensional view led to the idea of socioeconomic status (SES).","r":"Ch. 10 Social Stratification, “Max Weber: Class, Status, and Power”, p. 256"},{"c":10,"p":"B","q":"Sociologists distinguish between two kinds of social mobility. Which of the following is/are correct?","o":["Only i and ii","Only ii and iv","Only i, ii, and iii","All of them"],"a":2,"e":"Mobility can be upward or downward. Intergenerational mobility usually reveals long-term changes in society.","r":"Ch. 11 Social Class in the United States, “Social Mobility”, p. 275","st":[["Social mobility is a change in position within the social hierarchy.",1],["Intragenerational social mobility is a change in social position occurring during a person’s lifetime.",1],["Intergenerational social mobility is upward or downward mobility of children in relation to their parents.",1],["Social mobility can only be upward.",0]]},{"c":10,"p":"B","q":"In a society, a person’s occupation, marriage partner, and circle of friends are all fixed at birth, and people learn that accepting their position is a moral duty. This society has ___","o":["a caste system.","a class system.","a meritocracy.","low status consistency."],"a":0,"e":"A caste system is based on ascription, or birth, and allows little or no social mobility.","r":"Ch. 10 Social Stratification, “The Caste System”, p. 244"},{"c":10,"p":"B","q":"Which of the following describe(s) how the traditional caste system works in India?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"The caste system has hung on in rural India some seventy years after being formally outlawed.","r":"Ch. 10 Social Stratification, “The Caste System: An Illustration: India”, p. 244","st":[["Families in each caste perform one type of work.",1],["Caste guides everyday life by keeping people in the company of “their own kind.”",1],["The system rests on powerful cultural beliefs rooted in the Hindu tradition.",1],["The system has disappeared completely from rural India since it was outlawed.",0]]},{"c":10,"p":"B","q":"Caste systems are typical of agrarian societies because ___","o":["agrarian societies have no inequality.","farming requires many different talents that must be developed.","agriculture demands a lifelong routine of hard work, and caste teaches a sense of moral duty to perform it.","agrarian societies have the most social mobility."],"a":2,"e":"Caste ensures people are disciplined for a lifetime of work and willing to do the same jobs as their parents.","r":"Ch. 10 Social Stratification, “Caste and Agrarian Life”, p. 245"},{"c":10,"p":"B","q":"Why do industrial societies keep some caste elements, such as letting wealth pass from generation to generation, rather than becoming pure meritocracies?","o":["Because industrial economies do not need talented workers.","Because the law forbids social mobility.","Because caste systems are more productive than class systems.","Because a pure meritocracy, with people constantly moving up and down, would pull apart families and other social groupings."],"a":3,"e":"Class systems develop some meritocracy for productivity but keep caste elements, such as family, to maintain order.","r":"Ch. 10 Social Stratification, “Caste and Class: The United Kingdom / Meritocracy”, p. 247"},{"c":10,"p":"B","q":"Which of the following statements about ideology is/are correct?","o":["Only i, ii, and iii","Only i and iv","Only ii and iii","All of them"],"a":0,"e":"Culture and institutions combine to support a society’s elite, which is why established hierarchies last a long time.","r":"Ch. 10 Social Stratification, “Ideology: Supporting Stratification”, p. 252","st":[["Every culture considers some type of inequality just.",1],["Ideology changes along with a society’s economy and technology.",1],["With industrial capitalism, an ideology of meritocracy defines wealth and power as prizes won by those who perform best.",1],["Ideology has no effect on how long a hierarchy lasts.",0]]},{"c":10,"p":"B","q":"Critics of the Marxist analysis of social stratification point to the low productivity of former socialist economies. Their main argument is that the Marxist view ___","o":["overstates the importance of economic inequality in capitalist societies.","argues that stratification benefits society as a whole.","ignores the role of class conflict.","denies that a system of unequal rewards is necessary to place talented people in the right jobs and motivate them to work hard."],"a":3,"e":"Critics link the low productivity of former socialist economies to their failure to reward individual performance.","r":"Ch. 10 Social Stratification, “Karl Marx: Class Conflict (Evaluate)”, p. 254"},{"c":10,"p":"B","q":"Which dimension of inequality stands out in each type of society, according to the multidimensional view of stratification?","o":["Agrarian: class; industrial: power; socialist: status","Agrarian: power; industrial: status; socialist: class","Agrarian: class; industrial: status; socialist: power","Agrarian: status (prestige); industrial: class; socialist: power"],"a":3,"e":"Weber doubted that overthrowing capitalism would lessen stratification, because socialism concentrates power in a political elite.","r":"Ch. 10 Social Stratification, “Max Weber: Class, Status, and Power (Inequality in History)”, p. 256"},{"c":13,"p":"B","q":"Which of the following is an example of gender rather than sex?","o":["Differences in chromosomes","Differences in reproductive organs","The expectation that girls play with dolls and boys with toy trucks","Differences in hormones"],"a":2,"e":"Sex is biological. Gender is the cultural meaning attached to being female or male.","r":"Ch. 13 Gender Stratification, “Gender and Inequality”, p. 319"},{"c":13,"p":"B","q":"Research in three societies of New Guinea found that in one, both sexes were cooperative and sensitive to others; in another, both sexes were selfish and aggressive; and in a third, females were dominant and males were emotional. What does this research suggest?","o":["Culture, not biology, is the key to gender distinctions.","Biology determines what is feminine and masculine.","Gender is defined the same way in every society.","Men are dominant in all societies."],"a":0,"e":"If gender were biological, it would be defined the same way everywhere. Instead it varies across cultures.","r":"Ch. 13 Gender Stratification, “Margaret Mead’s Research”, p. 321"},{"c":13,"p":"B","q":"A study of more than 200 preindustrial societies found that ___","o":["women did all the farming in every society.","all tasks were assigned to the same sex in every society.","men took care of children in most societies.","apart from a few tasks such as hunting and warfare, societies were as likely to assign many tasks to one sex as the other."],"a":3,"e":"Gender is too variable across societies to be a simple expression of biology.","r":"Ch. 13 Gender Stratification, “George Murdock’s Research”, p. 321"},{"c":13,"p":"B","q":"Among the Musuo in southwestern China, women control most property, select their sexual partners, and make most decisions about everyday life. The Musuo appear to be a case of ___","o":["patriarchy.","matriarchy.","sexism.","intersection theory."],"a":1,"e":"Matriarchy has only rarely been documented. Patriarchy is found almost everywhere.","r":"Ch. 13 Gender Stratification, “Patriarchy and Sexism”, p. 321"},{"c":13,"p":"B","q":"Which of the following statements about sexism is/are correct?","o":["Only i and ii","Only ii and iv","Only i, ii, and iii","All of them"],"a":2,"e":"Sexism is built into institutions as well as individual attitudes.","r":"Ch. 13 Gender Stratification, “Patriarchy and Sexism”, p. 322","st":[["Sexism is the belief that one sex is innately superior to the other.",1],["Sexism is the justification for patriarchy.",1],["Sexism is built into institutions, for example when women are highly concentrated in low-paying jobs.",1],["Sexism is only a matter of individual attitudes.",0]]},{"c":13,"p":"B","q":"A company says it welcomes women into management, but very few women are ever promoted above middle management. Company officials deny that any barrier exists. This pattern is best described as ___","o":["the glass ceiling.","the second shift.","matriarchy.","the beauty myth."],"a":0,"e":"The glass ceiling is not easy to see, but it blocks women’s careers all the same.","r":"Ch. 13 Gender Stratification, “Gender and Occupations”, p. 327"},{"c":13,"p":"B","q":"Mei works full time as an accountant. When she gets home, she cooks, cleans, and helps the children with homework while her husband, who also works full time, relaxes. Sociologists describe Mei’s evening work as ___","o":["her expressive role.","the glass ceiling.","comparable worth.","the second shift."],"a":3,"e":"Women who work for income still do most of the housework, adding a second shift to the day.","r":"Ch. 13 Gender Stratification, “Housework: Women’s “Second Shift””, p. 328"},{"c":13,"p":"B","q":"From a structural-functional perspective, gender forms a complementary set of roles. Boys are socialized to show ___ qualities, while girls are socialized to show ___ qualities.","o":["expressive; instrumental","instrumental; expressive","conflict; functional","achieved; ascribed"],"a":1,"e":"Critics say complementarity amounts to little more than women submitting to men.","r":"Ch. 13 Gender Stratification, “Structural-Functional Theory: Gender and Social Integration”, p. 335"},{"c":13,"p":"B","q":"Which of the following statements about feminism and related theories is/are correct?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":3,"e":"Liberal feminists reform the system. Socialist and radical feminists seek to transform it.","r":"Ch. 13 Gender Stratification, “Feminism: Types of Feminism”, pp. 339–341","st":[["Liberal feminism accepts the basic organization of society but seeks to expand the rights and opportunities of women.",1],["Socialist feminism argues that capitalism intensifies patriarchy and supports an end to social classes and family gender roles.",1],["Radical feminism seeks to end gender itself as a way of organizing society.",1],["Intersection theory analyzes the interplay of race, class, and gender, which often results in multiple dimensions of disadvantage.",1]]},{"c":13,"p":"B","q":"A culture defines boys as ambitious and competitive, so they are encouraged to seek leadership positions and play team sports, while girls are expected to be supportive helpers. This shows how ___ shape behavior.","o":["gender roles","matriarchy","intersection theory","the incest taboo"],"a":0,"e":"Gender roles (sex roles) are attitudes and activities that a society links to each sex.","r":"Ch. 13 Gender Stratification, “Gender and Socialization”, p. 323"},{"c":13,"p":"B","q":"Research observing children at play found that ___","o":["Only i and ii","Only ii and iv","Only i, ii, and iii","All of them"],"a":2,"e":"Female peer groups promote the interpersonal skills of communication and cooperation.","r":"Ch. 13 Gender Stratification, “Gender and the Peer Group”, p. 324","st":[["boys favor team sports with complex rules and clear objectives.",1],["boys’ games nearly always have winners and losers, reinforcing aggression and control.",1],["girls’ activities such as hopscotch or jump rope have few rules, and victory is rarely the goal.",1],["female peer groups mainly teach girls to be competitive.",0]]},{"c":13,"p":"B","q":"Which of the following statements about the “beauty myth” is/are correct?","o":["Only i and iii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"The beauty myth also affects men, who are told they should want to possess beautiful women.","r":"Ch. 13 Gender Stratification, “Gender and the Mass Media: The Beauty Myth”, p. 325","st":[["It teaches women to measure their worth in terms of physical attractiveness to men.",1],["It teaches women to prize relationships with men, whom they presumably attract with their beauty.",1],["It helps explain why many young women focus on body image, sometimes to the point of endangering their health.",1],["It affects only women and has no effect on men.",0]]},{"c":13,"p":"B","q":"According to the textbook, which of the following help(s) explain why women earn less than men?","o":["Only i, ii, and iii","Only i and iv","Only ii and iii","All of them"],"a":0,"e":"Type of work and family responsibilities explain about two-thirds of the gap. Discrimination explains most of the rest.","r":"Ch. 13 Gender Stratification, “Gender, Income, and Wealth”, pp. 327–328","st":[["The type of work women do, largely clerical and service jobs.",1],["Society’s view of the family, which gives more parenting responsibility to women.",1],["Discrimination against women, often practiced in subtle ways.",1],["Women today have much less schooling than men.",0]]},{"c":13,"p":"B","q":"From a social-conflict perspective, the “double exploitation” of capitalism refers to ___","o":["paying women more than men for the same work.","paying low wages for male labor and paying women no wages at all.","forcing both men and women to work two jobs.","excluding women from schooling and from the vote."],"a":1,"e":"From this view, the rise of capitalism makes male domination even stronger.","r":"Ch. 13 Gender Stratification, “Social-Conflict Theory: Gender and Class”, p. 337"},{"c":13,"p":"B","q":"From a symbolic-interaction perspective, which of the following describes how gender shapes everyday conversation?","o":["Women usually initiate interaction and set the topics of discussion.","Men and women typically share control of conversations equally.","Women usually interrupt men to control the conversation.","Men typically speak first, set the topics, and interrupt more, while women are expected to be more deferential."],"a":3,"e":"People with more power tend to take charge of social encounters.","r":"Ch. 13 Gender Stratification, “Symbolic-Interaction Theory: Gender and Everyday Life”, p. 336"},{"c":13,"p":"B","q":"Which of the following best reflects intersection theory?","o":["All women share a single “woman’s experience.”","Gender inequality operates independently of race and class.","Some women are disadvantaged more than others, because race, class, and gender combine to create multiple disadvantages.","Social class is the only dimension of inequality that matters."],"a":2,"e":"There is no single “woman’s experience”: women of color, older women, and women with disabilities have particular standing.","r":"Ch. 13 Gender Stratification, “Intersection Theory”, p. 337"},{"c":13,"p":"B","q":"Most feminists support five general principles. Which of the following is NOT one of them?","o":["Expanding human choice","Ending sexual violence","Promoting the superiority of women over men","Eliminating gender stratification"],"a":2,"e":"The five principles are increasing equality, expanding choice, eliminating gender stratification, ending sexual violence, and promoting sexual freedom.","r":"Ch. 13 Gender Stratification, “Feminism: Basic Feminist Ideas”, p. 338"},{"c":14,"p":"B","q":"Which of the following statements about race and ethnicity is/are correct?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"Race and ethnicity often go hand in hand.","r":"Ch. 14 Race and Ethnicity, “Ethnicity”, p. 350","st":[["Race is constructed from biological traits, and ethnicity is constructed from cultural traits.",1],["Ethnicity is a shared cultural heritage.",1],["People may play up or play down cultural traits depending on whether they want to fit in or stand apart.",1],["Race and ethnicity never go hand in hand.",0]]},{"c":14,"p":"B","q":"Black South Africans are a numerical majority in their country, yet sociologists have described them as a minority. Why?","o":["Because they speak many different languages.","Because minorities are defined only by population size.","Because they share a distinctive identity and have been set apart and subordinated, regardless of their numbers.","Because they recently immigrated to South Africa."],"a":2,"e":"A minority is defined by a distinctive identity and subordination, not by being few in number.","r":"Ch. 14 Race and Ethnicity, “Minorities”, p. 351"},{"c":14,"p":"B","q":"An employer refuses to hire any applicant from a particular ethnic group. This is an example of ___","o":["discrimination.","prejudice.","a stereotype.","ethnicity."],"a":0,"e":"Prejudice is an attitude. Discrimination is an action.","r":"Ch. 14 Race and Ethnicity, “Discrimination”, p. 356"},{"c":14,"p":"B","q":"Which of the following statements about social distance research is/are correct?","o":["Only i","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"Willingness to marry into the family shows the least social distance, not the greatest.","r":"Ch. 14 Race and Ethnicity, “Measuring Prejudice: The Social Distance Scale”, pp. 354–355","st":[["Social distance refers to how closely people are willing to interact with members of some category.",1],["Over the long term, students have become more accepting of minorities.",1],["The greatest social distance is expressed by wanting a category of people barred from the country.",1],["Students express the greatest social distance by being willing to have a group marry into their family.",0]]},{"c":14,"p":"B","q":"A public figure claims that one racial category is naturally more intelligent than another. Sociologists would call this claim ___","o":["ethnicity.","assimilation.","pluralism.","racism."],"a":3,"e":"Racism is the belief that one racial category is innately superior or inferior to another.","r":"Ch. 14 Race and Ethnicity, “Racism”, p. 355"},{"c":14,"p":"B","q":"Banks reject home mortgage applications from minorities at a higher rate than those from white people, even when income and neighborhood quality are the same. Sociologists call this ___","o":["scapegoating.","an authoritarian personality.","institutional prejudice and discrimination.","assimilation."],"a":2,"e":"Bias can be built into schools, hospitals, the police, and the workplace.","r":"Ch. 14 Race and Ethnicity, “Institutional Prejudice and Discrimination”, p. 357"},{"c":14,"p":"B","q":"Which of the following patterns of interaction between majority and minority is/are correctly defined?","o":["Only i, ii, and iii","Only ii and iv","Only i and iv","All of them"],"a":0,"e":"Miscegenation means biological reproduction across racial lines. Genocide is systematic killing.","r":"Ch. 14 Race and Ethnicity, “Majority and Minority: Patterns of Interaction”, pp. 357–358","st":[["Pluralism: a state in which people of all races and ethnicities are distinct but have equal social standing.",1],["Assimilation: the process by which minorities gradually adopt patterns of the dominant culture.",1],["Segregation: the physical and social separation of categories of people.",1],["Miscegenation: the systematic killing of one category of people by another.",0]]},{"c":14,"p":"B","q":"Prejudice pushes minorities into low-paying jobs and inferior schools; the resulting disadvantage is then taken as evidence that minorities do not measure up, which produces more prejudice. This process is called ___","o":["genocide.","the vicious circle of prejudice and discrimination.","pluralism.","the scapegoat theory."],"a":1,"e":"This applies the Thomas theorem: situations defined as real become real in their consequences.","r":"Ch. 14 Race and Ethnicity, “Prejudice and Discrimination: The Vicious Circle”, p. 357"},{"c":14,"p":"B","q":"A man believes that people of his own ethnic group are naturally more hardworking and honest than everyone else. According to the textbook, this is an example of ___","o":["discrimination.","institutional discrimination.","pluralism.","a positive prejudice."],"a":3,"e":"Positive prejudices exaggerate the virtues of people like ourselves. Prejudice is an attitude, not an action.","r":"Ch. 14 Race and Ethnicity, “Prejudice and Stereotypes”, p. 353"},{"c":14,"p":"B","q":"Linking being Arab or Muslim with being a terrorist is an unfair ___ because it blames an entire category of people for the actions of a few individuals.","o":["stereotype","pluralism","assimilation","institutional discrimination"],"a":0,"e":"A stereotype is a simplified description applied to every person in some category.","r":"Ch. 14 Race and Ethnicity, “Prejudice and Stereotypes”, p. 352"},{"c":14,"p":"B","q":"A woman frustrated by her low factory pay blames her minority co-workers rather than the powerful owners. This illustrates ___","o":["culture theory.","conflict theory.","authoritarian personality theory.","scapegoat theory."],"a":3,"e":"Blaming a less powerful group is a relatively safe way to express anger.","r":"Ch. 14 Race and Ethnicity, “Theories of Prejudice: Scapegoat Theory”, p. 355"},{"c":14,"p":"B","q":"According to authoritarian personality theory, people with extreme prejudice ___","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"People strongly prejudiced toward one minority are usually intolerant of all minorities.","r":"Ch. 14 Race and Ethnicity, “Theories of Prejudice: Authoritarian Personality Theory”, p. 356","st":[["rigidly conform to conventional cultural values.",1],["see moral issues as clear-cut matters of right and wrong.",1],["view society as naturally competitive and hierarchical.",1],["are usually intolerant of one minority but accepting of all others.",0]]},{"c":14,"p":"B","q":"Research shows that students across the country hold much the same attitudes toward specific racial and ethnic categories, and that minorities express the same attitudes toward categories other than their own. This supports ___","o":["culture theory.","scapegoat theory.","authoritarian personality theory.","convergence theory."],"a":0,"e":"We live in a “culture of prejudice” that teaches us all to rank categories of people.","r":"Ch. 14 Race and Ethnicity, “Theories of Prejudice: Culture Theory”, p. 356"},{"c":14,"p":"B","q":"Anglos in the Southwest who look down on Latino immigrants can get away with paying them low wages for long hours of hard work. Which theory of prejudice does this example illustrate?","o":["Scapegoat theory","Authoritarian personality theory","Conflict theory","Culture theory"],"a":2,"e":"Elites benefit when prejudice divides workers along racial and ethnic lines.","r":"Ch. 14 Race and Ethnicity, “Theories of Prejudice: Conflict Theory”, p. 356"},{"c":14,"p":"B","q":"Poor residents of some inner-city neighborhoods have little contact of any kind with people outside their local community. Sociologists call this ___","o":["assimilation.","pluralism.","genocide.","hypersegregation."],"a":3,"e":"Hypersegregation is the daily experience of about 20 percent of poor African Americans.","r":"Ch. 14 Race and Ethnicity, “Majority and Minority: Segregation”, p. 359"},{"c":14,"p":"B","q":"Why do sociologists consider the old racial types (Caucasoid, Negroid, Mongoloid) misleading?","o":["Because each category contains only biologically pure people.","Because there is more genetic variation within each category than between categories, and no society contains biologically “pure” people.","Because skin color is identical within each category.","Because the three categories differ in most of their genes."],"a":1,"e":"The three categories differ in just 6 percent of their genes.","r":"Ch. 14 Race and Ethnicity, “The Social Meaning of Race: Racial Types”, p. 349"},{"c":14,"p":"B","q":"Which of the following statements about prejudice and discrimination is/are correct?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":3,"e":"Positive discrimination provides special advantages. Negative discrimination creates obstacles.","r":"Ch. 14 Race and Ethnicity, “Discrimination”, p. 356","st":[["Prejudice refers to attitudes, while discrimination is a matter of action.",1],["Prejudices can be positive or negative.",1],["Discrimination can be positive or negative.",1],["Discrimination ranges from subtle to extreme.",1]]},{"c":18,"p":"B","q":"Which of the following can form the basis of kinship?","o":["Only i, ii, and iii","Only i and ii","Only ii and iv","All of them"],"a":0,"e":"Kinship is a social bond based on common ancestry, marriage, or adoption.","r":"Ch. 18 Families, “Families: Basic Concepts”, p. 456","st":[["Common ancestry",1],["Marriage",1],["Adoption",1],["Being classmates at the same school",0]]},{"c":18,"p":"B","q":"A group of close friends who think of themselves as a family and wish others to see them that way is an example of ___","o":["an extended family.","a conjugal family.","a blended family.","a family of affinity."],"a":3,"e":"Families of affinity rest on how people see themselves, not on blood or legal ties.","r":"Ch. 18 Families, “Families: Basic Concepts”, p. 457"},{"c":18,"p":"B","q":"Which of the following statements about family forms is/are correct?","o":["Only i and ii","Only ii and iii","Only i, ii, and iv","All of them"],"a":2,"e":"Consanguine means “shared blood.” Conjugal means “based on marriage.”","r":"Ch. 18 Families, “Families: Basic Concepts”, pp. 456–457","st":[["The extended family is also called the consanguine family.",1],["The nuclear family is also called the conjugal family.",1],["The nuclear family includes grandparents, aunts, and uncles.",0],["An extended family consists of parents and children as well as other kin.",1]]},{"c":18,"p":"B","q":"In a mountainous farming region, a woman marries two brothers. This keeps the family’s land from being divided into parcels too small to support a family. This marriage pattern is ___","o":["polygyny.","polyandry.","monogamy.","endogamy."],"a":1,"e":"Polyandry unites one woman and two or more men. It is extremely rare.","r":"Ch. 18 Families, “Marriage Patterns”, p. 459"},{"c":18,"p":"B","q":"A university-educated man in his thirties marries a university-educated woman of the same age, ethnicity, and social class. This illustrates ___","o":["exogamy.","polygamy.","homogamy.","neolocality."],"a":2,"e":"Society “arranges” marriages by encouraging like to marry like.","r":"Ch. 18 Families, “Stages of Family Life: Courtship”, p. 463"},{"c":18,"p":"B","q":"Which of the following is/are causes of the high divorce rate identified in the textbook?","o":["Only i and iv","Only ii, iii, and iv","Only i and ii","Only i, ii, and iii"],"a":3,"e":"Divorce has become easier to get legally, not harder.","r":"Ch. 18 Families, “Divorce”, p. 469","st":[["Individualism is on the rise.",1],["Romantic love fades.",1],["Women are less dependent on men.",1],["Divorce has become more difficult to obtain legally.",0]]},{"c":18,"p":"B","q":"From a social-conflict perspective, the family historically arose because men needed to ___","o":["identify heirs so that they could pass property on to their sons.","socialize children into the culture.","regulate sexual activity through the incest taboo.","provide emotional security to all family members."],"a":0,"e":"Social-conflict and feminist theories link the family to property, inheritance, and patriarchy.","r":"Ch. 18 Families, “Social-Conflict and Feminist Theories”, pp. 461–462"},{"c":18,"p":"B","q":"From a structural-functional perspective, why is the incest taboo necessary for social organization?","o":["Only i and ii","Only i, ii, and iii","Only ii and iv","All of them"],"a":1,"e":"The taboo exists in every society, but exactly which relatives are covered varies.","r":"Ch. 18 Families, “Structural-Functional Theory: Functions of the Family”, p. 461","st":[["It limits sexual competition in families by restricting sex to spouses.",1],["Because kinship defines people’s rights and obligations, it keeps those relationships clear.",1],["By requiring people to marry outside their immediate families, it ties together the larger society.",1],["The relatives covered by the taboo are exactly the same in every society.",0]]},{"c":18,"p":"B","q":"With industrialization, social mobility and geographic migration led most people to carry out their everyday routines in families of one or two parents and their children. This type of family is the ___","o":["extended family.","consanguine family.","family of affinity.","nuclear (conjugal) family."],"a":3,"e":"Preindustrial societies recognize the extended family. Industrialization gives rise to the nuclear family.","r":"Ch. 18 Families, “Families: Basic Concepts”, p. 457"},{"c":18,"p":"B","q":"A society requires people to marry outside their own village or kin group. This is an example of ___","o":["endogamy.","homogamy.","exogamy.","monogamy."],"a":2,"e":"Endogamy is marriage within the same social category. Exogamy is marriage between different categories.","r":"Ch. 18 Families, “Marriage Patterns”, p. 457"},{"c":18,"p":"B","q":"Societies that engage in frequent local warfare tend toward ___ so that sons are close to home to offer protection.","o":["matrilocality","neolocality","bilateral descent","patrilocality"],"a":3,"e":"Patrilocality means living with or near the husband’s family. Matrilocality means near the wife’s family.","r":"Ch. 18 Families, “Residential Patterns”, p. 460"},{"c":18,"p":"B","q":"Which of the following statements about patterns of authority in families is/are correct?","o":["Only i and ii","Only ii and iv","Only i, ii, and iii","All of them"],"a":2,"e":"Men are still typically heads of households, but egalitarian patterns are growing.","r":"Ch. 18 Families, “Patterns of Authority”, p. 460","st":[["Worldwide, polygyny, patrilocality, and patrilineal descent reflect the common global pattern of patriarchy.",1],["In industrial societies like the United States, most parents still give children their father’s last name.",1],["More egalitarian family patterns are evolving as more women enter the labor force.",1],["Matriarchal family authority is the dominant pattern worldwide.",0]]},{"c":18,"p":"B","q":"While dating, two people weigh each other’s income, education, and looks. Each ends up with a partner who offers about the same level of advantages. Which theory best explains this?","o":["Social-exchange theory","Structural-functional theory","Social-conflict theory","Mass-society theory"],"a":0,"e":"Exchange theory sees courtship and marriage as negotiation: people “shop around” for the best deal.","r":"Ch. 18 Families, “Social-Exchange Theory”, p. 462"},{"c":18,"p":"B","q":"From a symbolic-interaction perspective, family life is best understood as ___","o":["a system that performs functions for society as a whole.","a site where property is passed to heirs.","a reality constructed by family members through their interaction.","a negotiation of advantages between partners."],"a":2,"e":"Shared experiences build emotional bonds and a sense of family over time.","r":"Ch. 18 Families, “Symbolic-Interaction Theory”, p. 462"},{"c":18,"p":"B","q":"Which of the following is/are arguments of social-conflict and feminist theories of the family?","o":["Only i and ii","Only i, ii, and iii","Only ii and iii","All of them"],"a":1,"e":"Conflict theories focus on how families reproduce class, gender, and racial inequality.","r":"Ch. 18 Families, “Social-Conflict and Feminist Theories”, p. 462","st":[["Families help pass property to heirs, so they concentrate wealth.",1],["Families transform women into the sexual and economic property of men.",1],["Endogamous marriage supports racial and ethnic inequality.",1],["Families mainly ive effort to rebuild. The way new rules of behavior developed as the situation unfolded is best explained by ___","o":["contagion theory.","convergence theory.","mass-society theory.","emergent-norm theory."],"a":3,"e":"Emergent-norm theory is a middle ground: crowds develop their own norms as the situation unfolds.","r":"Ch. 23 Collective Behavior and Social Movements, “Theories of Crowd Behavior: Emergent-Norm Theory”, p. 598"},{"c":23,"p":"B","q":"Which of the following statements about mobs and riots is/are correct?","o":["Only i, ii, and iii","Only ii and iv","Only i and iv","All of them"],"a":0,"e":"A mob ends when its goal is reached. A riot goes on until rioters run out of steam or are controlled.","r":"Ch. 23 Collective Behavior and Social Movements, “Mobs and Riots”, p. 596","st":[["A mob is a highly emotional crowd that pursues a violent or destructive goal.",1],["A riot is a social eruption that is highly emotional, violent, and undirected.",1],["Mobs tend to dissipate quickly.",1],["A riot usually ends as soon as one specific goal is accomplished.",0]]},{"c":23,"p":"B","q":"Protesters against a repressive government came together because they already shared political attitudes; the crowd did not create those attitudes. Which theory best explains this?","o":["Contagion theory","Mass-society theory","Convergence theory","Emergent-norm theory"],"a":2,"e":"In convergence theory, people who wish to act a certain way come together to form crowds.","r":"Ch. 23 Collective Behavior and Social Movements, “Theories of Crowd Behavior: Convergence Theory”, p. 598"},{"c":23,"p":"B","q":"A peaceful celebration turns destructive. Shielded by the anonymity of the crowd, people do things they would never do alone, and emotion seems to spread from person to person. Which theory best explains this?","o":["Contagion theory","Convergence theory","Emergent-norm theory","Resource-mobilization theory"],"a":0,"e":"Contagion theory says crowds have a hypnotic influence on their  (mass behavior) involves people who influence one another despite being spread over a large area.",1],["Rumors and fashion are examples of localized collectivities.",0]]},{"c":23,"p":"B","q":"A college lecture, a country auction, and a presidential inauguration are examples of a(n) ___","o":["casual crowd.","acting crowd.","conventional crowd.","expressive crowd."],"a":2,"e":"Behavior in a conventional crowd follows a clear set of norms.","r":"Ch. 23 Collective Behavior and Social Movements, “Crowds”, p. 596"},{"c":23,"p":"B","q":"Which of the following are characteristics of rumor described in the textbook?","o":["Only i, ii, and iii","Only i and iv","Only ii and iii","All of them"],"a":0,"e":"Gossip is rumor about personal affairs, so it tends to stay local.","r":"Ch. 23 Collective Behavior and Social Movements, “Mass Behavior: Rumor and Gossip”, p. 598","st":[["Rumor thrives in a climate of uncertainty.",1],["Rumor is unstable, as people change it while passing it along.",1],["Rumor is difficult to stop.",1],["Gossip spreads more widely than rumor because it concerns issues many people care about.",0]]},{"c":23,"p":"B","q":"A strange dance challenge spreads online, is wildly popular for a few weeks, and then disappears. This is an example of a ___","o":["fashion.","fad.","rumor.","panic."],"a":1,"e":"A fad is an unconventional pattern embraced briefly but enthusiastically. Fashions tend to be more durable.","r":"Ch. 23 Collective Behavior and Social Movements, “Fashions and Fads”, p. 600"},{"c":23,"p":"B","q":"Before the French Revolution, peasants in France, whose lives had been improving, rebelled, while peasants in Germany, who were much worse off, did not. Which theory of social movements best explains this?","o":["Mass-society theory","Resource-mobilization theory","New social movements theory","Deprivation theory (relative deprivation)"],"a":3,"e":"Movements arise from relative deprivation: improvements raise expectations, and people compare their situation with what they hope for.","r":"Ch. 23 Collective Behavior and Social Movements, “Explaining Social Movements: Deprivation Theory”, p. 605"},{"c":23,"p":"B","q":"A small movement of low-income workers gets nowhere until university students and wealthy supporters provide money, office space, and media contacts; then it succeeds. Which theory best explains this?","o":["Resource-mobilization theory","Mass-society theory","Deprivation theory","Political-economy theory"],"a":0,"e":"Success depends on resources. Sympathetic outsiders can fill the resource gap for disadvantaged people.","r":"Ch. 23 Collective Behavior and Social Movements, “Explaining Social Movements: Resource-Mobilization Theory”, p. 607"},{"c":23,"p":"B","q":"Structural-strain theory identifies six factors that encourage social movements. Which of the following is NOT one of them?","o":["Structural conduciveness","Growth and spread of an explanation","Precipitating factors","A large supply of money from wealthy outside supporters"],"a":3,"e":"The six factors are conduciveness, strain, an explanation, precipitating factors, mobilization for action, and lack of social control.","r":"Ch. 23 Collective Behavior and Social Movements, “Explaining Social Movements: Structural-Strain Theory”, p. 608"},{"c":23,"p":"B","q":"According to new social movements theory, recent social movements in postindustrial societies ___","o":["Only i and iv","Only ii and iii","Only i, ii, and iii","All of them"],"a":2,"e":"Critics say the theory exaggerates the differences between past and present movements.","r":"Ch. 23 Collective Behavior and Social Movements, “Explaining Social Movements: New Social Movements Theory”, pp. 609–610","st":[["focus mainly on quality-of-life issues rather than economic issues.",1],["tend to be national or international in scope.",1],["usually draw support from the middle and upper-middle classes.",1],["draw strong support mainly from working-class people, like older labor movements.",0]]}];
const CH={1:"Sociological Perspective",3:"Culture",5:"Socialization",6:"Social Interaction",7:"Groups & Organizations",9:"Deviance",10:"Social Stratification",13:"Gender Stratification",14:"Race & Ethnicity",18:"Families",23:"Collective Behavior & Social Movements"};
const L="ABCD",ROM=["i","ii","iii","iv"];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY="soc2101-known-v2";
let known=new Set(store.get(KEY,[]));
const S={mode:"flash",deck:"all",list:[],i:0,flipped:false,picked:null,right:0,missed:[]};
const $=id=>document.getElementById(id);
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const chName=c=>`Ch. ${c} · ${CH[c]}`;

// deck menu
(()=>{const sel=$("deck"),cnt=f=>Q.filter(f).length;
 const opts=[["all",`All questions (${Q.length})`],["A",`Part A · Ch. 1–9 (${cnt(q=>q.p==="A")})`],["B",`Part B · Ch. 10–23 (${cnt(q=>q.p==="B")})`]];
 Object.keys(CH).forEach(c=>opts.push(["c"+c,`Ch. ${c} · ${CH[c]} (${cnt(q=>q.c==c)})`]));
 sel.innerHTML=opts.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join("");})();
const inDeck=i=>{const q=Q[i],d=S.deck;return d==="all"||(d==="A"||d==="B")&&q.p===d||d==="c"+q.c};

function build(ids){
 S.list=ids||Q.map((_,i)=>i).filter(inDeck);
 S.i=0;S.flipped=false;S.picked=null;S.right=0;S.missed=[];
 $("done").hidden=true;render();
}
function shuffle(){
 const a=S.list.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}
 build(a);
}
const stHTML=(q,reveal)=>q.st?`<ol class="st">${q.st.map(([t,ok],j)=>`<li class="${reveal?(ok?"t":"f"):""}"><em>${ROM[j]}.</em><span>${esc(t)}</span></li>`).join("")}</ol>`:"";
const studyHTML=q=>`<div class="study"><strong>Study in the textbook</strong>${esc(q.r)}</div>`;
function render(){
 const n=S.list.length,qi=S.list[S.i],q=Q[qi];
 $("count").textContent=`${S.i+1} / ${n}`;
 $("fill").style.width=`${((S.i+(S.mode==="quiz"&&S.picked!==null?1:0))/n)*100}%`;
 $("tally").textContent=S.mode==="quiz"?`Score ${S.right}`:`Known ${S.list.filter(i=>known.has(i)).length}`;
 const card=$("card");
 const tag=`<div class="tag"><span>${chName(q.c)}</span><span>Q${qi+1}</span></div>`;
 if(S.mode==="flash"){
  card.classList.toggle("flip",S.flipped);
  $("front").innerHTML=`${tag}<p class="q">${esc(q.q)}</p>${stHTML(q,false)}<ul class="opts">${q.o.map((o,k)=>`<li><b>${L[k]}</b><span>${esc(o)}</span></li>`).join("")}</ul><p class="hint">Tap the card to see the answer</p>`;
  $("back").innerHTML=`${tag}<p class="ans">Correct answer</p><p style="margin:0 0 12px"><span class="big">${L[q.a]}. ${esc(q.o[q.a])}</span></p>${q.st?`<p class="ans">True statements are highlighted</p>${stHTML(q,true)}`:""}<p class="exp" style="margin-top:4px"><strong>Why:</strong> ${esc(q.e)}</p>${studyHTML(q)}<p class="hint">Tap to flip back</p>`;
  card.setAttribute("aria-label",S.flipped?"Answer side":"Question side. Tap to flip.");
  $("controls").innerHTML=S.flipped
   ?`<button class="btn ghost" id="learn">Still learning</button><button class="btn yellow" id="know">I knew it</button>`
   :`<button class="btn ghost" id="prev" ${S.i?"":"disabled"}>Previous</button><button class="btn white" id="next">${S.i===n-1?"Finish":"Next"}</button>`;
 }else{
  card.classList.remove("flip");
  const p=S.picked;
  $("front").innerHTML=`${tag}<p class="q">${esc(q.q)}</p>${stHTML(q,p!==null)}<div class="opts">${q.o.map((o,k)=>{
   let cl="";if(p!==null){cl=k===q.a?"ok":k===p?"no":"dim"}
   return `<button class="${cl}" data-k="${k}" ${p!==null?"disabled":""}><b>${L[k]}</b><span>${esc(o)}</span></button>`}).join("")}</div>
   ${p!==null?`<div class="fb"><strong>${p===q.a?"Correct!":`Not quite. The answer is ${L[q.a]}.`}</strong>${esc(q.e)}</div>${studyHTML(q)}`:`<p class="hint">Choose one answer</p>`}`;
  $("controls").innerHTML=`<button class="btn white full" id="next" ${p===null?"disabled":""}>${S.i===n-1?"See my score":"Next question"}</button>`;
 }
 $("front").scrollTop=0;$("back").scrollTop=0;
}
function finish(){
 const n=S.list.length,d=$("done");
 if(S.mode==="quiz"){
  const pct=Math.round(S.right/n*100);
  const msg=pct===100?"Perfect score!":pct>=80?"Great work!":pct>=50?"Good effort, keep going.":"Keep practising.";
  d.innerHTML=`<div class="score">${S.right}/${n}</div><h2>${msg}</h2><p>${S.missed.length?`You missed ${S.missed.length}. Review them now while they're fresh.`:"You answered every question correctly."}</p>
   <div class="controls">${S.missed.length?`<button class="btn yellow full" id="rMiss">Retry the ${S.missed.length} I missed</button>`:""}<button class="btn ghost full" id="again" style="background:#a92b22">Start again</button></div>`;
 }else{
  const k=S.list.filter(i=>known.has(i)).length,left=S.list.filter(i=>!known.has(i));
  d.innerHTML=`<div class="score">${k}/${n}</div><h2>${k===n?"You know them all!":"Deck complete"}</h2><p>${left.length?`${left.length} card${left.length>1?"s":""} still marked as learning.`:"Try the Quiz mode to test yourself."}</p>
   <div class="controls">${left.length?`<button class="btn yellow full" id="rLearn">Study the ${left.length} still learning</button>`:`<button class="btn yellow full" id="toQuiz">Take the quiz</button>`}<button class="btn ghost full" id="again" style="background:#a92b22">Start again</button><button class="btn white full" id="reset" style="border:2px solid #c8372d">Clear my progress</button></div>`;
 }
 d.hidden=false;$("controls").innerHTML="";
 $("fill").style.width="100%";
}
function next(){if(S.i<S.list.length-1){S.i++;S.flipped=false;S.picked=null;render()}else finish()}
function setMode(m){S.mode=m;$("mFlash").setAttribute("aria-pressed",m==="flash");$("mQuiz").setAttribute("aria-pressed",m==="quiz");build()}

$("mFlash").onclick=()=>setMode("flash");
$("mQuiz").onclick=()=>setMode("quiz");
$("deck").onchange=e=>{S.deck=e.target.value;build()};
$("shuf").onclick=shuffle;
$("card").addEventListener("click",e=>{
 if(S.mode==="flash"){S.flipped=!S.flipped;render();return}
 const b=e.target.closest("button[data-k]");if(!b||S.picked!==null)return;
 S.picked=+b.dataset.k;const qi=S.list[S.i];
 if(S.picked===Q[qi].a)S.right++;else S.missed.push(qi);
 render();
});
$("card").addEventListener("keydown",e=>{if(S.mode==="flash"&&(e.key===" "||e.key==="Enter")){e.preventDefault();S.flipped=!S.flipped;render()}});
$("controls").addEventListener("click",e=>{
 const id=e.target.id;
 if(id==="next")next();
 if(id==="prev"&&S.i){S.i--;S.flipped=false;render()}
 if(id==="know"||id==="learn"){const qi=S.list[S.i];id==="know"?known.add(qi):known.delete(qi);store.set(KEY,[...known]);next()}
});
$("done").addEventListener("click",e=>{
 const id=e.target.id;
 if(id==="again")build();
 if(id==="rMiss")build(S.missed.slice());
 if(id==="rLearn")build(S.list.filter(i=>!known.has(i)));
 if(id==="toQuiz")setMode("quiz");
 if(id==="reset"){known.clear();store.set(KEY,[]);build()}
});
let sx=null,sy=0;
$("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",e=>{
 if(sx===null||!$("done").hidden)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
 if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx))return;
 if(dx<0){if(S.mode==="flash"||S.picked!==null)next()}
 else if(S.mode==="flash"&&S.i){S.i--;S.flipped=false;render()}
});
build();
}
</script>
</body>
</html>
