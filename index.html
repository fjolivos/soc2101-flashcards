<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8372d">
<title>SOC2101 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, focused study companion — quick taps, no clutter
   IDEA: a stack of ruled index cards on a red study-desk blotter
   PICTURE: the card itself, large, flipping; a stack edge peeks behind it
   COLOUR and TYPE: tomato red ground, white ruled card, ink black, highlighter yellow for right answers; Archivo + Inter
   LAYOUT: one column, top bar with mode + deck, card fills the screen, big thumb buttons at bottom */
:root{color-scheme:light dark;
--bg:light-dark(#c8372d,#3d1210);--bg2:light-dark(#a92b22,#2a0c0a);
--card:light-dark(#ffffff,#1d1b1a);--ink:light-dark(#191716,#f3efe9);--soft:light-dark(#5e5853,#b5ada5);
--rule:light-dark(#d8e4f2,#2c3440);--margin:light-dark(#f1a7a1,#6b2b27);
--hi:#ffe14d;--hiInk:#191716;--bad:light-dark(#fde2df,#4a1a17);--badInk:light-dark(#a2241b,#ff9d94);
--onbg:#fff;--chip:rgba(255,255,255,.16)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px 18px;gap:14px}
header{color:var(--onbg);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:800 22px/1.05 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
h1 small{display:block;font:500 13px/1.3 Inter,sans-serif;opacity:.85;margin-top:3px}
.seg{display:flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--onbg);font:600 14px Inter,sans-serif;padding:10px 14px;border-radius:999px;min-height:40px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:#a92b22}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:0;background:var(--chip);color:var(--onbg);font:500 14px Inter,sans-serif;padding:9px 13px;border-radius:999px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:#a92b22;font-weight:600}
.icon{margin-inline-start:auto}
.prog{color:var(--onbg);font:600 13px Inter,sans-serif;display:flex;gap:10px;align-items:center}
.bar{flex:1;height:8px;background:var(--bg2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi);width:0;transition:width .3s}
.stage{position:relative;flex:1;min-height:420px;perspective:1400px}
.stage::before,.stage::after{content:"";position:absolute;inset:10px 10px -6px;background:var(--card);opacity:.55;border-radius:18px;transform:rotate(-1.6deg)}
.stage::after{inset:6px 4px -3px;opacity:.75;transform:rotate(1.2deg)}
.card{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:18px;
 box-shadow:0 14px 30px rgba(60,10,6,.35);padding:22px 20px 20px 34px;display:flex;flex-direction:column;overflow:auto;
 background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 24px,transparent 24px),
 repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 58px}
.back{transform:rotateY(180deg)}
.tag{font:600 12px Inter,sans-serif;color:var(--soft);display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.q{font:700 clamp(20px,5.4vw,24px)/1.25 Archivo,sans-serif;margin:0 0 16px;text-wrap:balance}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.opts li,.opts button{display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%;font:500 16px/1.4 Inter,sans-serif;color:var(--ink);
 background:color-mix(in srgb,var(--card) 88%,var(--ink));border:2px solid transparent;border-radius:12px;padding:11px 12px;min-height:48px}
.opts button{cursor:pointer}
.opts button:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.opts b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px Archivo,sans-serif;background:var(--card);border:1.5px solid var(--soft)}
.opts .ok{background:var(--hi);color:var(--hiInk);border-color:#e0bf1c}.opts .ok b{background:#fff;border-color:var(--hiInk);color:var(--hiInk)}
.opts .no{background:var(--bad);color:var(--badInk);border-color:currentColor}
.opts .dim{opacity:.5}
.hint{margin-top:auto;padding-top:14px;font:500 13px Inter,sans-serif;color:var(--soft);text-align:center}
.ans{font:500 13px Inter,sans-serif;color:var(--soft);margin:0 0 6px}
.big{font:800 clamp(22px,6vw,28px)/1.2 Archivo,sans-serif;margin:0 0 16px;background:linear-gradient(transparent 55%,var(--hi) 55% 92%,transparent 92%);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:var(--ink)}
.exp{margin:18px 0 0;font-size:16px;line-height:1.55}
.exp strong{font-family:Archivo,sans-serif}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;background:color-mix(in srgb,var(--card) 88%,var(--ink))}
.fb strong{display:block;font:800 16px Archivo,sans-serif;margin-bottom:2px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btn{border:0;border-radius:14px;min-height:54px;font:700 16px Archivo,sans-serif;cursor:pointer;padding:0 14px}
.btn.ghost{background:var(--bg2);color:#fff}
.btn.white{background:#fff;color:#a92b22}
.btn.yellow{background:var(--hi);color:var(--hiInk)}
.btn:disabled{opacity:.4;cursor:default}
.full{grid-column:1/-1}
.done{position:absolute;inset:0;z-index:2;background:var(--card);border-radius:18px;box-shadow:0 14px 30px rgba(60,10,6,.35);padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.score{font:800 clamp(64px,22vw,96px)/1 Archivo,sans-serif;color:#c8372d}
:root[data-theme=dark] .score{color:var(--hi)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .score{color:var(--hi)}}
.done h2{font:800 26px/1.1 Archivo,sans-serif;margin:4px 0}
.done p{margin:0 0 10px;color:var(--soft);max-width:34ch}
.done .controls{width:100%;max-width:360px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
 <header>
  <h1>SOC2101 Flashcards<small>Introduction to Sociology · Macionis Ch. 1 &amp; 3</small></h1>
 </header>
 <div class="seg" role="group" aria-label="Mode">
  <button id="mFlash" aria-pressed="true">Flashcards</button>
  <button id="mQuiz" aria-pressed="false">Quiz</button>
 </div>
 <div class="row" role="group" aria-label="Deck">
  <button class="chip" data-deck="all" aria-pressed="true">All 20</button>
  <button class="chip" data-deck="1" aria-pressed="false">Ch. 1 Perspective</button>
  <button class="chip" data-deck="3" aria-pressed="false">Ch. 3 Culture</button>
  <button class="chip icon" id="shuf" aria-label="Shuffle the cards">Shuffle</button>
 </div>
 <div class="prog"><span id="count">1 / 20</span><div class="bar"><i id="fill"></i></div><span id="tally"></span></div>
 <div class="stage" id="stage">
  <div class="card" id="card" tabindex="0" aria-live="polite">
   <div class="face front" id="front"></div>
   <div class="face back" id="back"></div>
  </div>
  <div class="done" id="done" hidden></div>
 </div>
 <div class="controls" id="controls"></div>
</div>
<script>
{
const Q=[
{c:1,q:"Peter Berger defined the sociological perspective as:",o:["Seeing the general in the particular","Seeing the strange in the familiar","Turning public issues into personal troubles","Studying society through common sense"],e:"Sociologists look for general patterns in the behaviour of particular people."},
{c:1,q:"Durkheim's study of suicide found the highest rates among which category?",o:["Protestants, men, the wealthy and the unmarried","Catholics and Jews","Married people","Women and the poor"],e:"Categories with weaker social ties (low social integration) had higher suicide rates."},
{c:1,q:"C. Wright Mills used the Great Depression to show that the “sociological imagination” turns:",o:["Personal troubles into public issues","Public issues into personal failings","Common sense into theory","Macro-level patterns into micro-level ones"],e:"Jobless people realised “the economy has collapsed” rather than “something is wrong with me.”"},
{c:1,q:"Which two situations most help people use the sociological perspective?",o:["Social marginality and social crisis","Wealth and education","Travel and reading","Religion and family life"],e:"Outsiders, and people living through change or crisis, see social patterns more clearly."},
{c:1,q:"Nations with a standard of living about average for the world as a whole are called:",o:["Middle-income countries","High-income countries","Low-income countries","Developing elites"],e:"About seventy nations, including much of Eastern Europe, Latin America and Asia."},
{c:1,q:"Who coined the term “sociology” in 1838?",o:["Auguste Comte","Karl Marx","Emile Durkheim","Herbert Spencer"],e:"Comte also proposed three stages of society: theological, metaphysical and scientific."},
{c:1,q:"Positivism is best defined as:",o:["A scientific approach to knowledge based on “positive” facts rather than speculation","An optimistic view of social progress","A focus on face-to-face interaction","A belief that society reflects God's will"],e:"Comte's scientific approach, the final stage in his three-stage model."},
{c:1,q:"Robert Merton called the unrecognised and unintended consequences of a social pattern:",o:["Latent functions","Manifest functions","Social dysfunctions","Social structures"],e:"Manifest functions are recognised and intended; latent functions are not."},
{c:1,q:"Which theoretical approach has a micro-level orientation?",o:["Symbolic-interaction approach","Structural-functional approach","Social-conflict approach","Race-conflict approach"],e:"It takes a close-up focus on everyday interaction. The others are macro-level."},
{c:1,q:"Which pioneer founded the Atlanta Sociological Laboratory and helped found the NAACP?",o:["W. E. B. Du Bois","Jane Addams","Harriet Martineau","Max Weber"],e:"Du Bois is linked to race-conflict theory and wrote The Philadelphia Negro (1899)."},
{c:3,q:"“The ideas created by members of a society,” such as art or Zen, are called:",o:["Nonmaterial culture","Material culture","Technology","Popular culture"],e:"Material culture is the physical things, “from armchairs to zippers.”"},
{c:3,q:"Personal disorientation when experiencing an unfamiliar way of life is called:",o:["Culture shock","Cultural lag","Ethnocentrism","Counterculture"],e:"Culture shock can happen abroad or at home, and it is a two-way process."},
{c:3,q:"Which is the foundation on which all the other elements of culture rest?",o:["Symbols","Norms","Values","Technology"],e:"A symbol is anything that carries a particular meaning recognised by people who share a culture."},
{c:3,q:"The Sapir-Whorf thesis states that:",o:["People see and understand the world through the cultural lens of language","All languages share a common grammar","Technology changes faster than ideas","Culture is rooted in biology"],e:"Current research suggests language shapes reality but does not determine it."},
{c:3,q:"Values are best described as:",o:["Culturally defined standards for deciding what is desirable, good and beautiful","Specific ideas people hold to be true","Rules that guide behaviour","Physical objects with shared meaning"],e:"Values are broad principles; beliefs are the specific ideas that values support."},
{c:3,q:"Norms that are widely observed and have great moral significance are called:",o:["Mores","Folkways","Values","Beliefs"],e:"William Graham Sumner coined the term. Mores separate right from wrong; folkways separate right from rude."},
{c:3,q:"Hip-hop fans and jocks are given as examples of a:",o:["Subculture","Counterculture","High culture","Cultural universal"],e:"A subculture sets apart one segment of a population; a counterculture strongly opposes widely accepted patterns."},
{c:3,q:"William Ogburn used “cultural lag” to mean:",o:["Some cultural elements change faster than others, disrupting a cultural system","The spread of culture from one society to another","Rejection of conventional ideas","The time it takes a child to learn language"],e:"Material culture (technology) often changes faster than nonmaterial culture (ideas) can keep up."},
{c:3,q:"Judging another culture by the standards of one's own culture is called:",o:["Ethnocentrism","Cultural relativism","Multiculturalism","Cultural integration"],e:"Cultural relativism is the opposite: judging a culture by its own standards."},
{c:3,q:"The dominance of European (especially English) cultural patterns is known as:",o:["Eurocentrism","Afrocentrism","Multiculturalism","Cultural diffusion"],e:"Multiculturalists criticise Eurocentrism. Asante's Afrocentrism emphasises African cultural patterns."}
];
// stable option order per question (correct answer = o[0] in data)
const L="ABCD";
const seedOrder=i=>{const a=[0,1,2,3];let s=i*7919+13;for(let k=3;k>0;k--){s=(s*1103515245+12345)%2147483648;const j=s%(k+1);[a[k],a[j]]=[a[j],a[k]]}return a};
let order=Q.map((_,i)=>seedOrder(i));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get("soc2101-known",[]));
const S={mode:"flash",deck:"all",list:[],i:0,flipped:false,picked:null,right:0,missed:[]};
const $=id=>document.getElementById(id);
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const chName=c=>c===1?"Ch. 1 · Sociological Perspective":"Ch. 3 · Culture";

function build(ids){
 S.list=ids||Q.map((_,i)=>i).filter(i=>S.deck==="all"||Q[i].c==+S.deck);
 S.i=0;S.flipped=false;S.picked=null;S.right=0;S.missed=[];
 $("done").hidden=true;render();
}
function shuffle(){
 const a=S.list.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}
 order=order.map(o=>{const b=o.slice();for(let k=3;k>0;k--){const j=Math.floor(Math.random()*(k+1));[b[k],b[j]]=[b[j],b[k]]}return b});
 build(a);
}
function render(){
 const n=S.list.length,qi=S.list[S.i],q=Q[qi],ord=order[qi];
 $("count").textContent=`${S.i+1} / ${n}`;
 $("fill").style.width=`${((S.i+(S.mode==="quiz"&&S.picked!==null?1:0))/n)*100}%`;
 $("tally").textContent=S.mode==="quiz"?`Score ${S.right}`:`Known ${S.list.filter(i=>known.has(i)).length}`;
 const card=$("card");
 const tag=`<div class="tag"><span>${chName(q.c)}</span><span>Q${qi+1}</span></div>`;
 if(S.mode==="flash"){
  card.classList.toggle("flip",S.flipped);
  $("front").innerHTML=`${tag}<p class="q">${esc(q.q)}</p><ul class="opts">${ord.map((o,k)=>`<li><b>${L[k]}</b><span>${esc(q.o[o])}</span></li>`).join("")}</ul><p class="hint">Tap the card to see the answer</p>`;
  const ci=ord.indexOf(0);
  $("back").innerHTML=`${tag}<p class="ans">Correct answer</p><p><span class="big">${L[ci]}. ${esc(q.o[0])}</span></p><p class="exp"><strong>Why:</strong> ${esc(q.e)}</p><p class="hint">Tap to flip back</p>`;
  card.setAttribute("aria-label",S.flipped?"Answer side":"Question side. Tap to flip.");
  $("controls").innerHTML=S.flipped
   ?`<button class="btn ghost" id="learn">Still learning</button><button class="btn yellow" id="know">I knew it</button>`
   :`<button class="btn ghost" id="prev" ${S.i?"":"disabled"}>Previous</button><button class="btn white" id="next">${S.i===n-1?"Finish":"Next"}</button>`;
 }else{
  card.classList.remove("flip");
  const p=S.picked,ci=ord.indexOf(0);
  $("front").innerHTML=`${tag}<p class="q">${esc(q.q)}</p><div class="opts">${ord.map((o,k)=>{
   let cl="";if(p!==null){cl=o===0?"ok":k===p?"no":"dim"}
   return `<button class="${cl}" data-k="${k}" ${p!==null?"disabled":""}><b>${L[k]}</b><span>${esc(q.o[o])}</span></button>`}).join("")}</div>
   ${p!==null?`<div class="fb"><strong>${ord[p]===0?"Correct!":`Not quite. The answer is ${L[ci]}.`}</strong>${esc(q.e)}</div>`:`<p class="hint">Choose one answer</p>`}`;
  $("controls").innerHTML=`<button class="btn white full" id="next" ${p===null?"disabled":""}>${S.i===n-1?"See my score":"Next question"}</button>`;
 }
}
function finish(){
 const n=S.list.length,d=$("done");
 if(S.mode==="quiz"){
  const pct=Math.round(S.right/n*100);
  const msg=pct===100?"Perfect score!":pct>=80?"Great work!":pct>=50?"Good effort, keep going.":"Keep practising.";
  d.innerHTML=`<div class="score">${S.right}/${n}</div><h2>${msg}</h2><p>${S.missed.length?`You missed ${S.missed.length}. Review them now while they're fresh.`:"You answered every question correctly."}</p>
   <div class="controls">${S.missed.length?`<button class="btn yellow full" id="rMiss">Retry the ${S.missed.length} I missed</button>`:""}<button class="btn ghost full" id="again" style="background:#a92b22">Start again</button></div>`;
 }else{
  const k=S.list.filter(i=>known.has(i)).length,left=S.list.filter(i=>!known.has(i));
  d.innerHTML=`<div class="score">${k}/${n}</div><h2>${k===n?"You know them all!":"Deck complete"}</h2><p>${left.length?`${left.length} card${left.length>1?"s":""} still marked as learning.`:"Try the Quiz mode to test yourself."}</p>
   <div class="controls">${left.length?`<button class="btn yellow full" id="rLearn">Study the ${left.length} still learning</button>`:`<button class="btn yellow full" id="toQuiz">Take the quiz</button>`}<button class="btn ghost full" id="again" style="background:#a92b22">Start again</button><button class="btn white full" id="reset" style="border:2px solid #c8372d">Clear my progress</button></div>`;
 }
 d.hidden=false;$("controls").innerHTML="";
 $("fill").style.width="100%";
}
function next(){if(S.i<S.list.length-1){S.i++;S.flipped=false;S.picked=null;render()}else finish()}
function setMode(m){S.mode=m;$("mFlash").setAttribute("aria-pressed",m==="flash");$("mQuiz").setAttribute("aria-pressed",m==="quiz");build()}

$("mFlash").onclick=()=>setMode("flash");
$("mQuiz").onclick=()=>setMode("quiz");
document.querySelectorAll("[data-deck]").forEach(b=>b.onclick=()=>{S.deck=b.dataset.deck;document.querySelectorAll("[data-deck]").forEach(x=>x.setAttribute("aria-pressed",x===b));build()});
$("shuf").onclick=shuffle;
$("card").addEventListener("click",e=>{
 if(S.mode==="flash"){S.flipped=!S.flipped;render();return}
 const b=e.target.closest("button[data-k]");if(!b||S.picked!==null)return;
 S.picked=+b.dataset.k;const qi=S.list[S.i];
 if(order[qi][S.picked]===0)S.right++;else S.missed.push(qi);
 render();
});
$("card").addEventListener("keydown",e=>{if(S.mode==="flash"&&(e.key===" "||e.key==="Enter")){e.preventDefault();S.flipped=!S.flipped;render()}});
$("controls").addEventListener("click",e=>{
 const id=e.target.id;
 if(id==="next")next();
 if(id==="prev"&&S.i){S.i--;S.flipped=false;render()}
 if(id==="know"||id==="learn"){const qi=S.list[S.i];id==="know"?known.add(qi):known.delete(qi);store.set("soc2101-known",[...known]);next()}
});
$("done").addEventListener("click",e=>{
 const id=e.target.id;
 if(id==="again")build();
 if(id==="rMiss")build(S.missed.slice());
 if(id==="rLearn")build(S.list.filter(i=>!known.has(i)));
 if(id==="toQuiz")setMode("quiz");
 if(id==="reset"){known.clear();store.set("soc2101-known",[]);build()}
});
// swipe left/right
let sx=null,sy=0;
$("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",e=>{
 if(sx===null||!$("done").hidden)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
 if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx))return;
 if(dx<0){if(S.mode==="flash"||S.picked!==null)next()}
 else if(S.mode==="flash"&&S.i){S.i--;S.flipped=false;render()}
});
build();
}
</script>
</body>
</html>
